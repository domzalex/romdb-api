name: Build Dataset

on:
  push:
    paths:
      - "dataset/*.json"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build dataset
        run: go run scripts/build_dataset.go

      - name: Commit generated dataset
        run: |
          git config user.name "dataset-bot"
          git config user.email "dataset-bot@users.noreply.github.com"
          git add generated/dataset.json
          git commit -m "chore: rebuild dataset" || exit 0
          git push
